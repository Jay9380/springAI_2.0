    <h1>사내 문서 검색에 RAG를 도입하며 배운 점</h1>
    <p>처음에는 문서를 통째로 임베딩했더니 검색 결과가 모두 비슷한 점수로 나와 쓸모가 없었다.</p>
    <p>문서를 문단 단위로 나누고, 제목과 카테고리를 메타데이터로 붙이자 원하는 문단이 상위에 올라오기 시작했다.</p>
    <p>가장 효과가 컸던 것은 폐기된 문서를 검색 대상에서 빼는 필터였다. 오래된 규정이 섞이면 답변이 틀려진다.</p>
