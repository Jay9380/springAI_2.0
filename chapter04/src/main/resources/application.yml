# 4장 실습 설정 (책 예제 4.31, 4.32)
#   ./mvnw -pl chapter04 spring-boot:run -Dspring-boot.run.arguments=--spring.ai.cli.step=ch4-step1
spring:
  application:
    name: chapter04
  main:
    web-application-type: none
    banner-mode: off
  ai:
    cli:
      step: ch4-final   # 기본: 툴 지원 CLI
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3.5:4b
        think: false
        temperature: 0.1     # 도구 선택과 인자 생성은 일관성이 중요하다

logging:
  level:
    root: warn
    kr.jay.springai: info
